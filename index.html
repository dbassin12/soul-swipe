<style>
/* Layout: on wide screens a short pitch + guided tour sits beside a phone-sized app; on phones the app fills the screen.
   Palette: cool linen ground, ink navy, techeiles blue for actions, gold for shadchanim and simchas. */
:root {
  --paper: #F3F4F8;
  --card: #FFFFFF;
  --sunk: #E9ECF3;
  --ink: #111830;
  --ink-2: #434C69;
  --muted: #636B85;
  --line: #DEE1EA;
  --line-2: #C6CBDA;
  --blue: #24449B;
  --blue-ink: #1F3C8A;
  --blue-soft: #E2E8F7;
  --on-blue: #FFFFFF;
  --gold: #C2902A;
  --gold-ink: #7A550C;
  --gold-soft: #F5ECD5;
  --on-gold: #1A1405;
  --sage: #2B7050;
  --sage-soft: #DCEDE3;
  --on-sage: #FFFFFF;
  --amber: #8C5B06;
  --amber-soft: #F6EAD0;
  --rose: #A43F4E;
  --rose-soft: #F5E0E3;
  --on-rose: #FFFFFF;
  --bezel: #0E1428;
  --scrim: rgb(8 12 26 / .45);
  /* Night surfaces (splash, Shabbos, mazel tov) look the same in both themes. */
  --night: #0E1630;
  --night-2: #1C2C63;
  --on-night: #F3EAD6;
  --on-night-2: #B8C0DA;
  --gold-night: #E2B65E;
  --night-panel: rgb(255 255 255 / .07);
  --night-line: rgb(255 255 255 / .16);
  /* Photo placeholder lightness steps */
  --ph-1: 82%;
  --ph-2: 66%;
  --ph-3: 89%;
  --ph-4: 74%;
  --ph-sil: 32%;
  --av-bg: 90%;
  --av-fg: 30%;
  --shadow-1: 0 1px 2px rgb(17 24 48 / .06), 0 4px 14px rgb(17 24 48 / .06);
  --shadow-2: 0 2px 6px rgb(17 24 48 / .08), 0 18px 40px rgb(17 24 48 / .14);
  --shadow-device: 0 40px 90px rgb(17 24 48 / .26), 0 10px 30px rgb(17 24 48 / .12);
  --sab: env(safe-area-inset-bottom, 0px);
  --sat: env(safe-area-inset-top, 0px);
  --display: 'Frank Ruhl Libre', 'Times New Roman', Georgia, serif;
  --ui: 'Assistant', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1121;
    --card: #151C31;
    --sunk: #1C2440;
    --ink: #E9ECF5;
    --ink-2: #BAC0D4;
    --muted: #8A91AA;
    --line: #252E4C;
    --line-2: #37426B;
    --blue: #8FA7F0;
    --blue-ink: #ABBDF6;
    --blue-soft: #1D2A55;
    --on-blue: #0C1121;
    --gold: #E0B45E;
    --gold-ink: #EBC67C;
    --gold-soft: #33290F;
    --on-gold: #1A1405;
    --sage: #7FC9A1;
    --sage-soft: #16302A;
    --on-sage: #0B1A13;
    --amber: #E8B967;
    --amber-soft: #36290F;
    --rose: #EE97A4;
    --rose-soft: #3A1E26;
    --on-rose: #1E0A0F;
    --bezel: #04070F;
    --scrim: rgb(0 0 0 / .6);
    --ph-1: 44%;
    --ph-2: 34%;
    --ph-3: 30%;
    --ph-4: 24%;
    --ph-sil: 62%;
    --av-bg: 26%;
    --av-fg: 84%;
    --shadow-1: 0 1px 2px rgb(0 0 0 / .35), 0 4px 14px rgb(0 0 0 / .25);
    --shadow-2: 0 2px 6px rgb(0 0 0 / .4), 0 18px 40px rgb(0 0 0 / .45);
    --shadow-device: 0 40px 90px rgb(0 0 0 / .6), 0 10px 30px rgb(0 0 0 / .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1121;
  --card: #151C31;
  --sunk: #1C2440;
  --ink: #E9ECF5;
  --ink-2: #BAC0D4;
  --muted: #8A91AA;
  --line: #252E4C;
  --line-2: #37426B;
  --blue: #8FA7F0;
  --blue-ink: #ABBDF6;
  --blue-soft: #1D2A55;
  --on-blue: #0C1121;
  --gold: #E0B45E;
  --gold-ink: #EBC67C;
  --gold-soft: #33290F;
  --on-gold: #1A1405;
  --sage: #7FC9A1;
  --sage-soft: #16302A;
  --on-sage: #0B1A13;
  --amber: #E8B967;
  --amber-soft: #36290F;
  --rose: #EE97A4;
  --rose-soft: #3A1E26;
  --on-rose: #1E0A0F;
  --bezel: #04070F;
  --scrim: rgb(0 0 0 / .6);
  --ph-1: 44%;
  --ph-2: 34%;
  --ph-3: 30%;
  --ph-4: 24%;
  --ph-sil: 62%;
  --av-bg: 26%;
  --av-fg: 84%;
  --shadow-1: 0 1px 2px rgb(0 0 0 / .35), 0 4px 14px rgb(0 0 0 / .25);
  --shadow-2: 0 2px 6px rgb(0 0 0 / .4), 0 18px 40px rgb(0 0 0 / .45);
  --shadow-device: 0 40px 90px rgb(0 0 0 / .6), 0 10px 30px rgb(0 0 0 / .4);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, label, [data-act] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.45 var(--ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.he { font-family: var(--display); font-size: 1.06em; }
.muted { color: var(--muted); }

/* ---------- Stage: pitch column + device ---------- */
.stage {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(40px, 5vw, 80px);
  padding-block: 24px;
  padding-inline: 24px;
  overflow: hidden;
}
.device-col {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.device {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 390px;
  max-width: 100%;
  max-height: 844px;
  border-radius: 46px;
  background: var(--paper);
  overflow: hidden;
  isolation: isolate;
  box-shadow: 0 0 0 10px var(--bezel), 0 0 0 11px var(--line-2), var(--shadow-device);
}
.device-note { margin: 0; font-size: 12.5px; color: var(--muted); flex: none; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
#sheet { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#sheet:not(:empty) { pointer-events: auto; }
#toasts { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 30; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#overlay { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
#overlay:not(:empty) { pointer-events: auto; }

@media (max-width: 540px) {
  .stage { padding-block: 0; padding-inline: 0; gap: 0; }
  .device-col { width: 100%; gap: 0; }
  .device { width: 100%; max-height: none; border-radius: 0; box-shadow: none; }
  .device-note { display: none; }
}

/* ---------- Pitch column (desktop) ---------- */
.deck { display: none; width: min(420px, 36vw); max-height: 100%; overflow-y: auto; flex-direction: column; gap: 15px; padding: 4px 10px 4px 2px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
@media (min-width: 1040px) { .deck { display: flex; } }
.deck-brand { display: flex; align-items: center; gap: 12px; }
.deck-name { font: 600 22px/1 var(--display); }
.deck-kicker { margin-top: 5px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.deck-title { margin: 0; font: 500 clamp(36px, 3.2vw, 48px)/1.02 var(--display); letter-spacing: -.015em; }
.deck-title span { color: var(--blue-ink); }
.deck-lede { margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink-2); max-width: 40ch; }
.deck-ideas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.deck-ideas li { position: relative; padding-left: 20px; font-size: 14.5px; line-height: 1.42; color: var(--ink-2); max-width: 46ch; }
.deck-ideas li::before { content: ''; position: absolute; left: 1px; top: .5em; width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); }
.deck-ideas b { color: var(--ink); font-weight: 700; }
.deck-tour { display: flex; flex-direction: column; gap: 10px; }
.deck-tour h2, .eyebrow { margin: 0; font: 700 12px/1.2 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.deck-tour ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.tour-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 7px 12px; border-radius: 12px; font-size: 14.5px; background: var(--card); box-shadow: var(--shadow-1); font-weight: 600; text-align: left; transition: box-shadow .15s ease; }
.tour-btn:hover { box-shadow: inset 0 0 0 1.5px var(--blue), var(--shadow-1); }
.tour-btn > span:nth-child(2) { flex: 1; min-width: 0; }
.tour-btn .ico { color: var(--muted); }
.tour-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--blue-soft); color: var(--blue-ink); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tour-btn.seen .tour-n { background: var(--sage-soft); color: var(--sage); }
.deck-foot { margin: 0; font-size: 13px; color: var(--muted); }

/* ---------- Brand mark ---------- */
.mark { --mk-a: var(--blue); --mk-b: var(--gold); flex: none; overflow: visible; }
.mark .mk-a, .mark .mk-b { fill: none; stroke-width: 3.2; stroke-linecap: round; }
.mark .mk-a { stroke: var(--mk-a); }
.mark .mk-b { stroke: var(--mk-b); }

/* ---------- Views ---------- */
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.pad { padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.view.in-push { animation: inPush .3s cubic-bezier(.2, .8, .2, 1); }
.view.in-pop { animation: inPop .26s cubic-bezier(.2, .8, .2, 1); }
.view.in-fade { animation: fadeIn .22s ease; }

/* Root header */
.hdr { flex: none; padding: calc(14px + var(--sat)) 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: 600 17px/1 var(--display); }
.v0 { font: 700 10.5px/1 var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--blue-ink); background: var(--blue-soft); padding: 5px 8px; border-radius: 99px; }
.bsd { font: 500 13px/1 var(--display); color: var(--muted); }
.hdr-title { margin: 8px 0 0; font: 500 29px/1.1 var(--display); letter-spacing: -.01em; }
.hdr-sub { margin: 0; color: var(--ink-2); font-size: 14.5px; }

/* Detail header */
.nav { flex: none; display: grid; grid-template-columns: 84px 1fr 84px; align-items: center; padding: calc(8px + var(--sat)) 10px 8px; border-bottom: 1px solid var(--line); background: var(--paper); }
.back { display: inline-flex; align-items: center; gap: 2px; padding: 8px 6px; border-radius: 10px; color: var(--blue-ink); font-weight: 700; }
.back .ico { width: 20px; height: 20px; }
.nav-title { text-align: center; min-width: 0; }
.nav-title b { display: block; font-weight: 700; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-title small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-right { justify-self: end; }

/* Tab bar */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(8px + var(--sab)); border-top: 1px solid var(--line); background: var(--card); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 3px; border-radius: 10px; color: var(--muted); font-size: 11.5px; font-weight: 700; text-align: center; }
.tab .ico { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--blue-ink); }
.tab-badge { position: absolute; top: 1px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--rose); color: var(--on-rose); font-size: 11px; line-height: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 13px; font-weight: 700; font-size: 15.5px; line-height: 1.2; text-align: center; transition: transform .12s ease, filter .15s ease; }
.btn:active { transform: scale(.98); }
.btn:hover { filter: brightness(1.06); }
.btn-primary { background: var(--blue); color: var(--on-blue); }
.btn-soft { background: var(--blue-soft); color: var(--blue-ink); }
.btn-ghost { color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line-2); }
.btn-gold { background: var(--gold); color: var(--on-gold); }
.btn-night { background: var(--night-panel); color: var(--on-night); box-shadow: inset 0 0 0 1px var(--night-line); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 0 13px; border-radius: 10px; font-size: 14px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--blue-ink); font-weight: 700; }
.link-btn .ico { width: 15px; height: 15px; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); }
.pulse { animation: pulse 1.3s ease-in-out 4; }

/* Sections */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h { margin: 0; font: 700 12.5px/1.2 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec-sub { margin: 0; color: var(--ink-2); font-size: 14px; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fine { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; }

/* Shabbos strip */
.shab-strip { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--gold-soft); text-align: left; font-size: 13.5px; line-height: 1.35; color: var(--ink); }
.shab-strip > span { flex: 1; min-width: 0; }
.shab-strip .ico:first-child { width: 22px; height: 22px; color: var(--gold-ink); }
.shab-strip .ico:last-child { color: var(--gold-ink); }

/* Photo placeholder: abstract, blurred until mutual interest */
.photo {
  --h: 210;
  display: block;
  position: relative;
  overflow: hidden;
  flex: none;
  border-radius: 14px;
  background:
    radial-gradient(110% 80% at 25% 15%, hsl(var(--h) 50% var(--ph-1)) 0%, transparent 60%),
    radial-gradient(90% 90% at 85% 85%, hsl(calc(var(--h) + 40) 40% var(--ph-2)) 0%, transparent 62%),
    linear-gradient(160deg, hsl(var(--h) 32% var(--ph-3)), hsl(calc(var(--h) + 25) 28% var(--ph-4)));
}
.photo .sil { position: absolute; left: 10%; bottom: -3%; width: 80%; height: 88%; fill: hsl(var(--h) 25% var(--ph-sil) / .42); filter: blur(7px); }
.photo.unlocked .sil { filter: blur(1px); }
.photo .lock { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--ink-2); box-shadow: var(--shadow-1); }
.photo .lock .ico { width: 14px; height: 14px; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-xs { width: 46px; height: 46px; border-radius: 12px; }
.photo-xs .lock { display: none; }
.photo-sm { width: 78px; height: 96px; }
.photo-md { width: 64px; height: 64px; border-radius: 16px; }
.photo-md .lock { width: 22px; height: 22px; right: 4px; bottom: 4px; }
.photo-lg { width: 100%; max-width: 100%; aspect-ratio: 5 / 4; border-radius: 20px; }
.photo-lg .lock { width: 34px; height: 34px; right: 12px; bottom: 12px; }
.photo-lg .lock .ico { width: 17px; height: 17px; }

/* Shadchan avatar */
.av { --h: 210; width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 14px/1 var(--ui); letter-spacing: .02em; color: hsl(var(--h) 45% var(--av-fg)); background: hsl(var(--h) 45% var(--av-bg)); }
.av-sm { width: 30px; height: 30px; font-size: 11.5px; }
.av-lg { width: 52px; height: 52px; font-size: 17px; }

/* Suggestion cards */
.sug { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; box-shadow: var(--shadow-1); overflow: hidden; }
.sug.leaving { animation: leave .28s ease forwards; pointer-events: none; }
.sug-main { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px 14px 12px; text-align: left; }
.sug-info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sug-name { font: 600 22px/1.15 var(--display); }
.sug-name .age { margin-left: 4px; font-weight: 500; color: var(--muted); }
.sug-meta { font-size: 14px; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { padding: 3px 9px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.why { margin: 0 14px; padding: 10px 12px; border-radius: 12px; background: var(--paper); display: flex; flex-direction: column; gap: 6px; }
.why-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.why ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.why li { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: var(--ink-2); }
.why li .ico { width: 16px; height: 16px; margin-top: 2px; color: var(--sage); }
.fit { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.fit-strong { color: var(--sage); }
.fit-good { color: var(--blue-ink); }
.fit-fair { color: var(--amber); }
.sug-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; padding: 12px 14px 14px; }
.pick-note { display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 0; }
.pick-note p { margin: 0; font: 400 16px/1.4 var(--display); color: var(--ink); }
.pick-note small { display: block; margin-top: 2px; font: 600 12.5px/1.3 var(--ui); color: var(--muted); }
.caught { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 20px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-1); text-align: center; }
.caught p { margin: 0; color: var(--ink-2); max-width: 30ch; }
.caught .caught-title { font: 600 20px/1.2 var(--display); color: var(--ink); }
.banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--amber-soft); color: var(--ink); font-size: 13.5px; }
.banner > span { flex: 1; }

/* Résumé / profile */
.pf-hero { display: flex; flex-direction: column; gap: 6px; }
.photo-cap { display: flex; align-items: center; gap: 6px; margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.photo-cap .ico { width: 14px; height: 14px; }
.pf-name { margin: 6px 0 0; font: 600 31px/1.1 var(--display); }
.pf-age { font-weight: 500; color: var(--muted); }
.pf-meta { margin: 0; color: var(--ink-2); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; background: var(--sunk); color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.badge .ico { width: 14px; height: 14px; }
.badge-gold { background: var(--gold-soft); color: var(--gold-ink); }
.paper { position: relative; display: flex; flex-direction: column; gap: 18px; padding: 26px 20px 20px; border-radius: 6px; background: var(--card); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.paper::before { content: ''; position: absolute; left: 14px; right: 14px; top: 9px; height: 4px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); opacity: .75; }
.paper-top { display: flex; justify-content: flex-end; margin-top: -8px; }
.paper-head { display: flex; align-items: center; gap: 14px; }
.paper-name { margin: 0; font: 600 28px/1.1 var(--display); }
.paper-meta { margin: 4px 0 0; color: var(--ink-2); }
.paper-foot { padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.rs { display: flex; flex-direction: column; gap: 8px; }
.rs h3 { margin: 0; font: 700 12px/1.2 var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--gold-ink); }
.kv { display: grid; grid-template-columns: minmax(92px, 34%) 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.prose { margin: 0; font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
.locked { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--paper); color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.locked .ico { margin-top: 2px; color: var(--muted); }
.locked b { color: var(--ink); }
.ref-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ref-list small { color: var(--muted); }
.sticky-actions { flex: none; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; padding: 12px 16px calc(14px + var(--sab)); border-top: 1px solid var(--line); background: var(--paper); }
.sticky-actions.one { grid-template-columns: 1fr; }
.sticky-note { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-2); }

/* Lists */
.list { display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-1); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.row-title { min-width: 0; font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-sub { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13.5px; color: var(--ink-2); }
.row-sub .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-chev { color: var(--line-2); }
.unread { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; background: var(--blue); color: var(--on-blue); font-size: 11.5px; font-weight: 700; }
.pill { display: inline-flex; align-items: center; flex: none; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.pill-blue { background: var(--blue-soft); color: var(--blue-ink); }
.pill-amber { background: var(--amber-soft); color: var(--amber); }
.pill-sage { background: var(--sage-soft); color: var(--sage); }
.pill-gold { background: var(--gold-soft); color: var(--gold-ink); }
.pill-muted { background: var(--sunk); color: var(--ink-2); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 16px 8px; text-align: center; }
.empty h2 { margin: 0; font: 600 22px/1.2 var(--display); }
.empty p { margin: 0; color: var(--ink-2); max-width: 30ch; }
.path { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-1); font-size: 13.5px; color: var(--ink-2); }
.path p { margin: 0; }

/* Shidduch detail */
.sd-top { display: flex; align-items: center; gap: 14px; }
.sd-name { font: 600 22px/1.15 var(--display); }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
.stepper li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.stepper li::before { content: ''; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line-2); }
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.cur::before { background: var(--blue); }
.stepper .dot { position: relative; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: inset 0 0 0 2px var(--line-2); }
.stepper li.done .dot { background: var(--blue); color: var(--on-blue); box-shadow: none; }
.stepper li.cur .dot { box-shadow: inset 0 0 0 2px var(--blue), 0 0 0 4px var(--blue-soft); }
.stepper li.cur .dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
.stepper .dot .ico { width: 14px; height: 14px; stroke-width: 2.6; }
.stepper .lbl { font-size: 11px; font-weight: 700; line-height: 1.2; color: var(--muted); }
.stepper li.cur .lbl { color: var(--ink); }
.stepper.closed li.done::before, .stepper.closed li.cur::before { background: var(--line-2); }
.stepper.closed li.done .dot { background: var(--muted); color: var(--card); }
.stepper.closed li.cur .dot { box-shadow: inset 0 0 0 2px var(--muted); }
.stepper.closed li.cur .dot::after { background: var(--muted); }
.act-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-1); }
.act-card h3 { margin: 0; font: 600 20px/1.2 var(--display); }
.act-card p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.act-card .hint { font-size: 13px; }
.waiting { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
.dots { display: inline-flex; gap: 4px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: blink 1.2s infinite both; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
.refs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ref { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--paper); text-align: left; }
.ref .box { width: 22px; height: 22px; border-radius: 7px; flex: none; display: grid; place-items: center; color: transparent; box-shadow: inset 0 0 0 2px var(--line-2); }
.ref .box .ico { width: 14px; height: 14px; stroke-width: 2.8; }
.ref[aria-pressed="true"] .box { background: var(--sage); color: var(--on-sage); box-shadow: none; }
.ref span:last-child { min-width: 0; }
.ref b { display: block; font-weight: 700; }
.ref small { color: var(--muted); font-size: 13px; }
.note-in { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--blue-soft); color: var(--blue-ink); font-size: 13.5px; }
.note-in .ico { margin-top: 1px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--line-2); text-align: left; }
.opt[aria-checked="true"] { background: var(--blue-soft); box-shadow: inset 0 0 0 2px var(--blue); }
.opt .radio { width: 20px; height: 20px; flex: none; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line-2); }
.opt[aria-checked="true"] .radio { box-shadow: inset 0 0 0 2px var(--blue); }
.opt[aria-checked="true"] .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.opt b { display: block; font-weight: 700; }
.opt small { color: var(--ink-2); font-size: 13px; }
.dates { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.date { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--paper); }
.date > div { flex: 1; min-width: 0; }
.date b { display: block; }
.date small { color: var(--muted); }
.date-n { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--sage-soft); color: var(--sage); font-weight: 700; font-variant-numeric: tabular-nums; }
.date.upcoming .date-n { background: var(--blue-soft); color: var(--blue-ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding-bottom: 14px; }
.timeline li::before { content: ''; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.tl-dot { width: 10px; height: 10px; margin: 5px 3px 0; border-radius: 50%; background: var(--blue); }
.timeline li:not(:first-child) .tl-dot { background: var(--line-2); }
.timeline p { margin: 0; font-size: 14px; }
.timeline time { font-size: 12px; color: var(--muted); }

/* Messages */
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--blue-soft); color: var(--blue-ink); font-size: 13.5px; line-height: 1.4; }
.notice p { margin: 0; }
.notice .ico { margin-top: 1px; }
.bubbles { display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 10px; }
.bubble { max-width: 82%; padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.them { align-self: flex-start; background: var(--card); box-shadow: var(--shadow-1); border-bottom-left-radius: 6px; }
.bubble.me { align-self: flex-end; background: var(--blue); color: var(--on-blue); border-bottom-right-radius: 6px; }
.bubble time { display: block; margin-top: 3px; font-size: 11px; opacity: .7; }
.day-sep { align-self: center; max-width: 88%; margin: 2px 0 8px; font-size: 12.5px; color: var(--muted); text-align: center; }
.typing { display: inline-flex; gap: 4px; padding: 13px 14px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
.quick { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 8px 28px 8px 14px; scrollbar-width: none; mask-image: linear-gradient(to right, #000 82%, transparent); -webkit-mask-image: linear-gradient(to right, #000 82%, transparent); }
.quick::-webkit-scrollbar { display: none; }
.quick .chip { white-space: nowrap; font-size: 13.5px; }
.composer { flex: none; display: flex; gap: 8px; padding: 8px 12px calc(10px + var(--sab)); border-top: 1px solid var(--line); background: var(--card); }
.composer .input { min-height: 42px; border-radius: 99px; padding: 8px 16px; }
.send { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: var(--on-blue); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: .01em; }
.label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); color: var(--ink); font-size: 16px; }
.input::placeholder { color: var(--muted); }
textarea.input { min-height: 116px; resize: vertical; line-height: 1.5; }
select.input {
  appearance: none;
  padding-right: 34px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.fieldgroup { display: flex; flex-direction: column; gap: 9px; }
.mini-h { margin: 6px 0 0; font: 600 19px/1.2 var(--display); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line-2); color: var(--ink-2); font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); box-shadow: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 13px; background: var(--sunk); }
.seg button { padding: 9px 6px; border-radius: 10px; font-size: 13.5px; font-weight: 700; line-height: 1.2; text-align: center; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--blue-ink); box-shadow: var(--shadow-1), inset 0 0 0 1.5px var(--blue); }
.photo-up { display: flex; align-items: center; gap: 14px; }
.photo-up > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.photo-up label.btn { align-self: flex-start; cursor: pointer; }
.photo-ph { width: 76px; height: 92px; flex: none; border-radius: 14px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); }
.photo-ph .ico { width: 26px; height: 26px; }

/* Onboarding */
.ob-hdr { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--sat)) 14px 6px; }
.ob-progress { flex: 1; height: 6px; overflow: hidden; border-radius: 99px; background: var(--sunk); }
.ob-progress span { display: block; height: 100%; border-radius: inherit; background: var(--blue); transition: width .35s ease; }
.ob-count { min-width: 30px; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ob-body { display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 28px; }
.ob-intro { display: flex; flex-direction: column; gap: 6px; }
.ob-title { margin: 0; font: 500 31px/1.08 var(--display); letter-spacing: -.01em; }
.ob-sub { margin: 0; color: var(--ink-2); }
.ob-foot { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 20px calc(16px + var(--sab)); border-top: 1px solid var(--line); background: var(--paper); }
.sample-box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--gold-soft); }
.sample-box p { margin: 0; font-size: 14px; }
.sample-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sample-row .btn { background: var(--card); color: var(--ink); box-shadow: var(--shadow-1); font-size: 14.5px; }

/* Splash */
.splash { position: relative; overflow: hidden; background: radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 72%); color: var(--on-night); }
.splash .scroll { display: flex; flex-direction: column; }
.splash .bsd { position: absolute; top: calc(18px + var(--sat)); right: 22px; color: var(--on-night-2); z-index: 1; }
.splash-top { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px 28px 20px; text-align: center; }
.splash-he { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -62%); font: 700 150px/1 var(--display); color: var(--on-night); opacity: .05; pointer-events: none; white-space: nowrap; }
.splash .mark { --mk-a: var(--on-night); --mk-b: var(--gold-night); position: relative; }
.splash-word { position: relative; font: 500 50px/1 var(--display); letter-spacing: .01em; }
.splash-tag { position: relative; margin: 0; font: 500 21px/1.2 var(--display); color: var(--gold-night); }
.splash-sub { position: relative; margin: 2px 0 0; max-width: 31ch; color: var(--on-night-2); font-size: 15px; }
.splash-panel { display: flex; flex-direction: column; gap: 12px; margin: 0 14px 14px; padding: 16px; border-radius: 22px; background: var(--night-panel); box-shadow: inset 0 0 0 1px var(--night-line); }
.splash-panel .label { color: var(--on-night-2); }
.persona-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.persona { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--night-panel); box-shadow: inset 0 0 0 1px var(--night-line); text-align: left; transition: box-shadow .15s ease; }
.persona:hover { box-shadow: inset 0 0 0 1.5px var(--gold-night); }
.persona b { display: block; font-size: 15px; }
.persona small { display: block; font-size: 12px; color: var(--on-night-2); line-height: 1.3; }
.splash-links { display: flex; justify-content: center; gap: 10px; font-size: 14px; color: var(--on-night-2); }
.splash-links button { font-weight: 700; color: var(--on-night); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--night-line); }

/* Ready */
.ready-pad { padding-top: 28px; align-items: flex-start; }
.ready-title { margin: 0; font: 500 32px/1.08 var(--display); }
.ready-pad > p { margin: 0; color: var(--ink-2); }
.mini { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-1); }
.mini > div { min-width: 0; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: flex; gap: 10px; color: var(--ink-2); }
.checks .ico { margin-top: 2px; color: var(--sage); }

/* Me */
.me-card { display: flex; align-items: center; gap: 14px; }
.me-name { font: 600 24px/1.15 var(--display); }
.self-av { width: 72px; height: 72px; flex: none; border-radius: 20px; overflow: hidden; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue-ink); font: 600 26px/1 var(--display); }
.self-av img { width: 100%; height: 100%; object-fit: cover; }
.complete { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow-1); }
.complete-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 14px; }
.bar { height: 8px; overflow: hidden; border-radius: 99px; background: var(--sunk); }
.bar span { display: block; height: 100%; border-radius: inherit; background: var(--sage); }
.stat-line { display: flex; align-items: flex-start; gap: 8px; margin: 0; font-size: 13.5px; color: var(--ink-2); }
.stat-line .ico { margin-top: 1px; color: var(--muted); }
.group { display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-1); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row.stack { flex-direction: column; align-items: stretch; gap: 10px; }
.set-row > div { min-width: 0; }
.set-title { font-weight: 700; }
.set-sub { font-size: 13px; color: var(--muted); line-height: 1.4; }
.set-row .ico { color: var(--muted); }
.switch { position: relative; width: 48px; height: 29px; flex: none; border-radius: 99px; background: var(--line-2); transition: background-color .2s ease; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s ease; }
.switch[aria-checked="true"] { background: var(--sage); }
.switch[aria-checked="true"]::after { transform: translateX(19px); }
.switch[aria-disabled="true"] { opacity: .65; cursor: default; }

/* Shadchan desk */
.desk-me { display: flex; align-items: center; gap: 12px; }
.desk-me b { display: block; font: 600 20px/1.15 var(--display); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.mazel canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.mazel .scroll { position: relative; z-index: 1; }
.mazel-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 24px 28px; text-align: center; }
.mazel-he { font: 700 64px/1 var(--display); color: var(--gold-night); }

.mazel-card p { margin: 2px 0 0; color: var(--on-night-2); font-size: 14px; }

.stars { position: absolute; inset: 0; pointer-events: none; }
.stars span { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--on-night); opacity: .55; animation: twinkle 3.4s ease-in-out infinite; }
.candles { position: relative; width: 150px; height: auto; }
.candles .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 2.6s ease-in-out infinite; }
.candles .flame.f2 { animation-delay: -1.3s; }
.candles .glow { animation: glow 3.2s ease-in-out infinite alternate; }
.shab-he { position: relative; margin: 2px 0 0; font: 500 22px/1 var(--display); color: var(--gold-night); }
.shab-title { position: relative; margin: 0; font: 500 42px/1.05 var(--display); }
.shab-copy { position: relative; margin: 0; max-width: 30ch; color: var(--on-night-2); }
.shab-times { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 310px; margin: 6px 0 0; }
.shab-times div { padding: 12px 10px; border-radius: 14px; background: var(--night-panel); }

.toast .link-btn { flex: none; }
.toast.out { animation: toastOut .25s ease forwards; }
.toast > .ico { color: var(--sage); }

/* Motion */
@keyframes inPush { from { opacity: 0; transform: translateX(22px); } }
@keyframes inPop { from { opacity: 0; transform: translateX(-22px); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(.98); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }
@keyframes leave { to { opacity: 0; transform: translateX(30px) scale(.98); } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--blue) 50%, transparent); } 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--blue) 0%, transparent); } }

@keyframes glow { from { opacity: .65; } to { opacity: 1; } }
@keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .75; } }
@media (prefers-reduced-motion: reduce) {
